<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste versão fechada</title>
    <!-- Ícone de celular verde na aba do navegador (Favicon SVG embutido) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='none'/><rect x='64' y='16' width='128' height='224' rx='24' fill='%2316a34a'/><line x1='104' y1='40' x2='152' y2='40' fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'/><circle cx='128' cy='204' r='12' fill='%23ffffff'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }

    <!-- Font Inter & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Firebase SDKs (Compat / Modular via CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        .dark ::-webkit-scrollbar-track { background: #0f172a; }

</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 flex flex-col">

    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i class="ph-bold ph-shield-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-tight">Teste versão fechada</h1>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="abrirModalReport()" class="flex items-center space-x-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium shadow-md shadow-emerald-600/20 transition active:scale-95">
                    <i class="ph-bold ph-plus-circle text-base"></i>
                    <span>Nova Ocorrência</span>
                </button>
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i id="theme-icon" class="ph-bold ph-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navegação de Abas -->
    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6">
            <button onclick="mudarAba('feed')" id="tab-btn-feed" class="py-3 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600 dark:text-emerald-400 flex items-center space-x-2 transition">
                <i class="ph-bold ph-broadcast text-base"></i>
                <span>Feed de Ocorrências</span>
            </button>
            <button onclick="mudarAba('checklist')" id="tab-btn-checklist" class="py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center space-x-2 transition">
                <i class="ph-bold ph-check-square text-base"></i>
                <span>Checklist de Testes</span>
            </button>
        </div>
    </div>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col space-y-6">

        <!-- ABA 1: FEED DE OCORRÊNCIAS -->
        <div id="aba-feed" class="flex flex-col space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div>
                    <h2 class="text-base font-bold flex items-center space-x-2">
                        <i class="ph-bold ph-broadcast text-emerald-600"></i>
                        <span>Feed em tempo real</span>
                    </h2>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <select id="filtro-plataforma" onchange="renderizarFeed()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="todas">Todas Plataformas</option>
                        <option value="Android">Android</option>
                        <option value="iOS">iOS</option>
                    </select>
                    <select id="filtro-status" onchange="renderizarFeed()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="todos">Todos Status</option>
                        <option value="Bug">Bug</option>
                        <option value="Ajuste">Ajuste</option>
                        <option value="Validado">Validado</option>
                        <option value="Dúvida">Dúvida</option>
                    </select>
                </div>
            </div>

            <div id="lista-feed" class="grid grid-cols-1 gap-5">
                <!-- Preenchido dinamicamente via Firebase -->
            </div>
        </div>

        <!-- ABA 2: CHECKLIST DE TESTES -->
        <div id="aba-checklist" class="hidden flex flex-col space-y-6">
            <div class="bg-white dark:bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 class="text-base font-bold flex items-center space-x-2">
                        <i class="ph-bold ph-check-square text-emerald-600"></i>
                        <span>Checklist de Validação da Versão</span>
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">O seu progresso de testes é individual e salvo apenas neste dispositivo[cite: 2].</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="limparChecklist()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                        <i class="ph-bold ph-arrow-counter-clockwise text-sm"></i>
                        <span>Limpar marcações</span>
                    </button>
                    <div id="checklist-progresso-container" class="flex items-center space-x-3">
                        <!-- Barra de progresso dinâmica -->
                    </div>
                </div>
            </div>

            <div id="lista-checklist" class="space-y-4">
                <!-- Preenchido dinamicamente -->
            </div>
        </div>

    </main>

    <!-- Modal de Reportar Nova Ocorrência -->
    <div id="modal-report" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center font-bold">
                        <i class="ph-bold ph-bug"></i>
                    </div>
                    <h3 class="font-bold text-base">Nova Ocorrência</h3>
                </div>
                <button onclick="fecharModalReport()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <form id="form-report" onsubmit="salvarReport(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Colaborador (Nome) *</label>
                        <input type="text" id="report-autor" required placeholder="Ex: Ana Souza" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Cliente *</label>
                        <input type="text" id="report-cliente" required placeholder="Ex: Supermercados ABC" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Plataforma *</label>
                        <select id="report-plataforma" required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Android">Android</option>
                            <option value="iOS">iOS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Tipo de status *</label>
                        <select id="report-tipo" onchange="verificarStatusCondicional()" required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Bug">Bug</option>
                            <option value="Ajuste">Ajuste</option>
                            <option value="Validado">Validado</option>
                            <option value="Dúvida">Dúvida</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Módulo / Rotina *</label>
                        <input type="text" id="report-modulo" required placeholder="Ex: Módulo: Vendas" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div id="container-ticket-ref" class="hidden">
                    <label class="block text-xs font-semibold text-emerald-600 dark:text-emerald-400 mb-1">Ticket de referência *</label>
                    <input type="text" id="report-ticket-ref" placeholder="Ex: #TICKET-4589" class="w-full bg-emerald-50/50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Descrição da ocorrência *</label>
                    <textarea id="report-descricao" rows="3" required placeholder="Descreva o que aconteceu..." class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Evidência (Print ou Vídeo)</label>
                    <div id="drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-4 text-center cursor-pointer hover:border-emerald-500 transition relative">
                        <input type="file" id="report-img-input" accept="image/*,video/*" onchange="tratarArquivoAnexo(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                        <div id="drop-zone-content" class="flex flex-col items-center space-y-1">
                            <i class="ph-bold ph-image text-2xl text-slate-400"></i>
                            <p class="text-xs text-slate-500">Clique para enviar ou cole com <span class="font-semibold text-emerald-600">Ctrl+V</span></p>
                        </div>
                        <div id="preview-container" class="hidden relative mt-2 inline-block">
                            <span id="preview-filename" class="text-xs font-medium text-emerald-600 dark:text-emerald-400 block bg-emerald-50 dark:bg-emerald-950/60 px-3 py-1.5 rounded-lg border border-emerald-200 dark:border-emerald-800"></span>
                            <button type="button" onclick="removerAnexoPreview(event)" class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full p-1 text-xs shadow hover:bg-rose-700"><i class="ph-bold ph-x"></i></button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="fecharModalReport()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm font-medium rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-emerald-600/20 transition">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Reportar Problema -->
    <div id="modal-reportar-problema" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center font-bold">
                        <i class="ph-bold ph-hand-fist"></i>
                    </div>
                    <h3 class="font-bold text-base">Reportar problema</h3>
                </div>
                <button onclick="fecharModalReportarProblema()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <form id="form-reportar-problema" onsubmit="salvarReportarProblema(event)" class="space-y-4">
                <input type="hidden" id="reportar-problema-card-id" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Seu Nome *</label>
                    <input type="text" id="reportar-problema-autor" required placeholder="Ex: Carlos Lima" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Nome do Seu Cliente Afetado *</label>
                    <input type="text" id="reportar-problema-cliente" required placeholder="Ex: Auto Posto Estrela" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Comentário Adicional (Opcional)</label>
                    <textarea id="reportar-problema-comentario" rows="2" placeholder="Ex: Aqui também apresentou o mesmo comportamento." class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="fecharModalReportarProblema()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm font-medium rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-amber-600/20 transition">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Visualizar Anexo -->
    <div id="modal-visualizar-anexo" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-3xl w-full p-4 shadow-2xl space-y-3 relative flex flex-col items-center">
            <div class="w-full flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="font-bold text-sm text-slate-700 dark:text-slate-200">Visualizar Evidência / Anexo</h3>
                <div class="flex items-center space-x-2">
                    <a id="btn-baixar-modal" href="#" download="evidencia" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1">
                        <i class="ph-bold ph-download text-xs"></i>
                        <span>Baixar</span>
                    </a>
                    <button onclick="fecharModalVisualizarAnexo()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                        <i class="ph-bold ph-x text-xl"></i>
                    </button>
                </div>
            </div>
            <div id="conteudo-anexo-modal" class="w-full flex justify-center items-center max-h-[75vh] overflow-auto">
                <!-- Inserido dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB7wj9Sq2LdHLZy7T0tOG-Lt2RVaUuolWQ",
            authDomain: "teste-versao-fechada.firebaseapp.com",
            projectId: "teste-versao-fechada",
            storageBucket: "teste-versao-fechada.firebasestorage.app",
            messagingSenderId: "10617609545",
            appId: "1:10617609545:web:0052a9d6159678d4ea4e98",
            measurementId: "G-FJ2BZVKGNS"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const checklistModelo = [
            {
                id: 'cat-inicio',
                titulo: 'Tela de Início / Dashboard',
                aberto: true,
                subcategorias: [
                    {
                        id: 'sub-desempenho',
                        titulo: 'Performance Comercial',
                        tarefas: [
                            { id: 't1', texto: 'Testar a performance do vendedor' },
                            { id: 't2', texto: 'Visualizar o ranking da performance comercial' }
                        ]
                    },
                    {
                        id: 'sub-mural',
                        titulo: 'Mural de Comunicações',
                        tarefas: [
                            { id: 't3', texto: 'Clicar no mural e validar se a imagem está aparecendo corretamente' },
                            { id: 't4', texto: 'Curtir o mural e deixar um comentário' }
                        ]
                    }
                ]
            },
            {
                id: 'cat-clientes',
                titulo: 'Tela de Clientes',
                aberto: false,
                subcategorias: [
                    {
                        id: 'sub-filtros-clientes',
                        titulo: 'Filtros e Listagem',
                        tarefas: [
                            { id: 't5', texto: 'Testar filtro de comprados no mês junto com cidade' },
                            { id: 't6', texto: 'Verificar se o cadastro de novo cliente salva com sucesso' }
                        ]
                    }
                ]
            },
            {
                id: 'cat-vendas',
                titulo: 'Módulo de Vendas / PDV',
                aberto: false,
                subcategorias: [
                    {
                        id: 'sub-pdv',
                        titulo: 'Emissão e Pagamento',
                        tarefas: [
                            { id: 't7', texto: 'Realizar uma venda utilizando forma de pagamento mista (Dinheiro + Cartão)' },
                            { id: 't8', texto: 'Testar cancelamento de item no carrinho antes de fechar a conta' }
                        ]
                    }
                ]
            }
        ];

        let appState = {
            feed: [],
            checklistChecks: JSON.parse(localStorage.getItem('tvf_checklist_checks_v1')) || {},
            checklistProblemas: JSON.parse(localStorage.getItem('tvf_checklist_prob_v1')) || {},
            checklistEstrutura: JSON.parse(localStorage.getItem('tvf_checklist_est_v1')) || checklistModelo,
            anexoAtualBase64: null,
            anexoAtualNome: null,
            tarefaSelecionadaParaReport: null
        };

        function salvarChecklistLocal() {
            localStorage.setItem('tvf_checklist_checks_v1', JSON.stringify(appState.checklistChecks));
            localStorage.setItem('tvf_checklist_prob_v1', JSON.stringify(appState.checklistProblemas));
            localStorage.setItem('tvf_checklist_est_v1', JSON.stringify(appState.checklistEstrutura));
        }

        // Função para limpar todas as marcações do checklist
        function limparChecklist() {
            if (confirm('Deseja realmente limpar todas as marcações e ocorrências relatadas no seu checklist?')) {
                appState.checklistChecks = {};
                appState.checklistProblemas = {};
                salvarChecklistLocal();
                renderizarChecklist();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            ouvirMudancasTempoReal();
            renderizarChecklist();

            window.addEventListener('paste', (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1 || items[i].type.indexOf('video') !== -1) {
                        const blob = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            appState.anexoAtualBase64 = event.target.result;
                            appState.anexoAtualNome = 'evidencia-colada.' + (blob.type.includes('video') ? 'mp4' : 'png');
                            document.getElementById('preview-filename').innerText = appState.anexoAtualNome;
                            document.getElementById('preview-container').classList.remove('hidden');
                            document.getElementById('drop-zone-content').classList.add('hidden');
                            if (document.getElementById('modal-report').classList.contains('hidden')) {
                                abrirModalReport();
                            }
                        };
                        reader.readAsDataURL(blob);
                    }
                }
            });
        });

        function mudarAba(aba) {
            const btnFeed = document.getElementById('tab-btn-feed');
            const btnChecklist = document.getElementById('tab-btn-checklist');
            const divFeed = document.getElementById('aba-feed');
            const divChecklist = document.getElementById('aba-checklist');

            if (aba === 'feed') {
                btnFeed.className = "py-3 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600 dark:text-emerald-400 flex items-center space-x-2 transition";
                btnChecklist.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center space-x-2 transition";
                divFeed.classList.remove('hidden');
                divChecklist.classList.add('hidden');
            } else {
                btnChecklist.className = "py-3 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-600 dark:text-emerald-400 flex items-center space-x-2 transition";
                btnFeed.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center space-x-2 transition";
                divChecklist.classList.remove('hidden');
                divFeed.classList.add('hidden');
            }
        }

        // Sincronização em tempo real do Feed via Firestore[cite: 2]
        function ouvirMudancasTempoReal() {
            db.collection('ocorrencias')
                .orderBy('timestamp', 'desc')
                .onSnapshot((snapshot) => {
                    appState.feed = [];
                    snapshot.forEach((doc) => {
                        const item = doc.data();
                        appState.feed.push({
                            id: doc.id,
                            autor: item.autor,
                            cliente: item.cliente,
                            plataforma: item.plataforma,
                            modulo: item.modulo,
                            tipo: item.tipo,
                            ticketRef: item.ticketRef || '',
                            descricao: item.descricao,
                            anexo: item.anexo,
                            anexoNome: item.anexoNome,
                            data: item.data,
                            abrirTicket: item.abrirTicket,
                            comentarios: item.comentarios || []
                        });
                    });
                    renderizarFeed();
                }, (error) => {
                    console.error("Erro ao ouvir dados do Firestore: ", error);
                });
        }

        function verificarStatusCondicional() {
            const tipo = document.getElementById('report-tipo').value;
            const containerTicket = document.getElementById('container-ticket-ref');
            const inputTicket = document.getElementById('report-ticket-ref');
            if (tipo === 'Validado') {
                containerTicket.classList.remove('hidden');
                inputTicket.setAttribute('required', 'true');
            } else {
                containerTicket.classList.add('hidden');
                inputTicket.removeAttribute('required');
                inputTicket.value = '';
            }
        }

        function renderizarFeed() {
            const filtroPlat = document.getElementById('filtro-plataforma').value;
            const filtroStatus = document.getElementById('filtro-status').value;
            const container = document.getElementById('lista-feed');
            container.innerHTML = '';

            const feedFiltrado = appState.feed.filter(f => {
                const matchPlat = filtroPlat === 'todas' || f.plataforma === filtroPlat;
                const matchStatus = filtroStatus === 'todos' || f.tipo === filtroStatus;
                return matchPlat && matchStatus;
            });

            if (feedFiltrado.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">Nenhuma ocorrência encontrada com estes filtros.</div>`;
                return;
            }

            feedFiltrado.forEach(item => {
                let badgeTipo = '';
                if (item.tipo === 'Bug') badgeTipo = '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400">Bug</span>';
                else if (item.tipo === 'Ajuste') badgeTipo = '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400">Ajuste</span>';
                else if (item.tipo === 'Validado') badgeTipo = '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400">Validado</span>';
                else badgeTipo = '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400">Dúvida</span>';

                let ticketRefHtml = item.ticketRef ? `<div class="mt-1 text-xs font-medium text-emerald-600 dark:text-emerald-400 flex items-center space-x-1"><i class="ph-bold ph-ticket"></i><span>Ticket de referência: ${item.ticketRef}</span></div>` : '';

                let comentariosHtml = '';
                if (item.comentarios && item.comentarios.length > 0) {
                    comentariosHtml = `<div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2 bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Clientes afetados (${item.comentarios.length})</p>`;
                    item.comentarios.forEach(c => {
                        comentariosHtml += `
                            <div class="text-xs space-y-0.5">
                                <div class="flex items-center space-x-2">
                                    <span class="font-semibold text-slate-700 dark:text-slate-300">${c.autor}</span>
                                    <span class="text-slate-400">•</span>
                                    <span class="px-2 py-0.5 rounded bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-medium">${c.cliente}</span>
                                </div>
                                ${c.texto ? `<p class="text-slate-600 dark:text-slate-300 pl-1">${c.texto}</p>` : ''}
                            </div>
                        `;
                    });
                    comentariosHtml += `</div>`;
                }

                let cardBgClass = "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800";
                let badgeAbrirTicket = "";
                if (item.abrirTicket) {
                    cardBgClass = "bg-amber-50/40 dark:bg-amber-950/20 border-amber-300 dark:border-amber-800";
                    badgeAbrirTicket = '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 dark:bg-amber-900 text-amber-800 dark:text-amber-200 flex items-center space-x-1"><i class="ph-bold ph-warning"></i><span>Pendente Abrir Ticket</span></span>';
                }

                let anexoHtml = '';
                if (item.anexo) {
                    const safeData = encodeURIComponent(item.anexo);
                    const safeName = encodeURIComponent(item.anexoNome || 'evidencia');
                    anexoHtml = `
                        <div class="mt-3 pt-2 flex items-center space-x-2">
                            <button onclick="abrirVisualizacaoAnexo('${safeData}', '${safeName}')" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                                <i class="ph-bold ph-eye text-emerald-600"></i>
                                <span>Ver Anexo (${item.anexoNome || 'Arquivo'})</span>
                            </button>
                            <a href="${item.anexo}" download="${item.anexoNome || 'evidencia'}" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                                <i class="ph-bold ph-download text-emerald-600"></i>
                                <span>Baixar</span>
                            </a>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `${cardBgClass} p-5 rounded-2xl border shadow-sm space-y-3 transition-all`;
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">${item.cliente}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 font-medium">${item.plataforma} • ${item.modulo}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${badgeAbrirTicket}
                            ${badgeTipo}
                        </div>
                    </div>

                    <p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">${item.descricao}</p>
                    ${ticketRefHtml}
                    ${anexoHtml}
                    ${comentariosHtml}

                    <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs text-slate-400">
                        <div class="flex items-center space-x-1.5">
                            <div class="w-6 h-6 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-[10px]">${item.autor.charAt(0)}</div>
                            <span class="font-medium text-slate-600 dark:text-slate-300">${item.autor}</span>
                            <span>• ${item.data}</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button onclick="abrirModalReportarProblema('${item.id}')" class="flex items-center space-x-1 px-3 py-1.5 bg-amber-50 dark:bg-amber-950/60 hover:bg-amber-100 text-amber-700 dark:text-amber-300 rounded-xl font-semibold transition border border-amber-200 dark:border-amber-800">
                                <i class="ph-bold ph-hand-fist text-xs"></i>
                                <span>Reportar problema</span>
                            </button>
                            <button onclick="toggleAbrirTicket('${item.id}', ${item.abrirTicket})" class="flex items-center space-x-1 px-3 py-1.5 ${item.abrirTicket ? 'bg-amber-600 text-white' : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300'} rounded-xl font-semibold transition">
                                <i class="ph-bold ph-ticket text-xs"></i>
                                <span>${item.abrirTicket ? 'Ticket Marcado' : 'Abrir ticket'}</span>
                            </button>
                            <button onclick="deletarOcorrencia('${item.id}')" class="flex items-center space-x-1 px-3 py-1.5 bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 text-rose-700 dark:text-rose-300 rounded-xl font-semibold transition border border-rose-200 dark:border-rose-800" title="Apagar ocorrência">
                                <i class="ph-bold ph-trash text-xs"></i>
                                <span>Indevido</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Lógica do Checklist Local
        function renderizarChecklist() {
            const container = document.getElementById('lista-checklist');
            const containerProgresso = document.getElementById('checklist-progresso-container');
            container.innerHTML = '';

            let totalTarefas = 0;
            let totalConcluidas = 0;

            appState.checklistEstrutura.forEach(cat => {
                let catConcluidas = 0;
                let catTotal = 0;

                cat.subcategorias.forEach(sub => {
                    sub.tarefas.forEach(t => {
                        catTotal++;
                        totalTarefas++;
                        if (appState.checklistChecks[t.id]) {
                            catConcluidas++;
                            totalConcluidas++;
                        }
                    });
                });

                const catDiv = document.createElement('div');
                catDiv.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm';

                let subHtml = '';
                cat.subcategorias.forEach(sub => {
                    let tarefasHtml = '';
                    sub.tarefas.forEach(t => {
                        const isChecked = !!appState.checklistChecks[t.id];
                        const hasProblem = !!appState.checklistProblemas[t.id];

                        let boxClass = "flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 rounded-xl border transition";
                        if (hasProblem) {
                            boxClass += " bg-rose-50/70 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800";
                        } else {
                            boxClass += " bg-slate-50/60 dark:bg-slate-800/40 border-slate-100 dark:border-slate-800";
                        }

                        tarefasHtml += `
                            <div class="${boxClass}">
                                <div class="flex items-start space-x-3">
                                    <button onclick="toggleCheckTarefa('${t.id}')" class="mt-0.5 w-5 h-5 rounded-lg border ${isChecked ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900'} flex items-center justify-center transition">
                                        ${isChecked ? '<i class="ph-bold ph-check text-xs"></i>' : ''}
                                    </button>
                                    <div class="flex flex-col">
                                        <span class="text-sm ${isChecked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}">${t.texto}</span>
                                        ${hasProblem ? '<span class="text-[11px] font-bold text-rose-600 dark:text-rose-400 mt-0.5 flex items-center space-x-1"><i class="ph-bold ph-warning"></i><span>Ocorrência relatada</span></span>' : ''}
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 self-end sm:self-auto">
                                    <button onclick="iniciarRelatoOcorrênciaChecklist('${t.id}', '${cat.titulo} > ${sub.titulo}')" class="px-2.5 py-1 bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 text-rose-700 dark:text-rose-300 rounded-lg text-xs font-semibold flex items-center space-x-1 transition border border-rose-200 dark:border-rose-800">
                                        <i class="ph-bold ph-bug text-xs"></i>
                                        <span>Relatar ocorrência</span>
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    subHtml += `
                        <div class="space-y-2 mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">${sub.titulo}</h4>
                            <div class="space-y-2">
                                ${tarefasHtml}
                            </div>
                        </div>
                    `;
                });

                catDiv.innerHTML = `
                    <div class="p-4 flex items-center justify-between cursor-pointer select-none bg-slate-50/50 dark:bg-slate-900 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition" onclick="toggleCategoriaChecklist('${cat.id}')">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center font-bold">
                                <i class="ph-bold ph-folder-notch-open"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-100">${cat.titulo}</h3>
                                <p class="text-xs text-slate-500">${catConcluidas} de ${catTotal} concluídas</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 text-slate-400">
                            <i class="ph-bold ${cat.aberto ? 'ph-caret-up' : 'ph-caret-down'} text-lg"></i>
                        </div>
                    </div>
                    <div class="${cat.aberto ? 'block' : 'hidden'} p-4 pt-0 space-y-4">
                        ${subHtml}
                    </div>
                `;
                container.appendChild(catDiv);
            });

            const porcentagem = totalTarefas > 0 ? Math.round((totalConcluidas / totalTarefas) * 100) : 0;
            containerProgresso.innerHTML = `
                <div class="text-right">
                    <span class="text-xs font-bold text-slate-600 dark:text-slate-400">${totalConcluidas}/${totalTarefas} (${porcentagem}%)</span>
                    <div class="w-32 h-2 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                        <div class="h-full bg-emerald-600 transition-all duration-300" style="width: ${porcentagem}%"></div>
                    </div>
                </div>
            `;
        }

        function toggleCategoriaChecklist(catId) {
            const cat = appState.checklistEstrutura.find(c => c.id === catId);
            if (cat) {
                cat.aberto = !cat.aberto;
                salvarChecklistLocal();
                renderizarChecklist();
            }
        }

        function toggleCheckTarefa(tarefaId) {
            appState.checklistChecks[tarefaId] = !appState.checklistChecks[tarefaId];
            salvarChecklistLocal();
            renderizarChecklist();
        }

        function iniciarRelatoOcorrênciaChecklist(tarefaId, moduloSugerido) {
            appState.tarefaSelecionadaParaReport = tarefaId;
            abrirModalReport();
            document.getElementById('report-modulo').value = moduloSugerido;
            document.getElementById('report-tipo').value = 'Bug';
            verificarStatusCondicional();
        }

        function abrirModalReport() {
            document.getElementById('modal-report').classList.remove('hidden');
            document.getElementById('modal-report').classList.add('flex');
        }

        function fecharModalReport() {
            document.getElementById('modal-report').classList.remove('flex');
            document.getElementById('modal-report').classList.add('hidden');
            document.getElementById('form-report').reset();
            document.getElementById('container-ticket-ref').classList.add('hidden');
            appState.anexoAtualBase64 = null;
            appState.anexoAtualNome = null;
            appState.tarefaSelecionadaParaReport = null;
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('drop-zone-content').classList.remove('hidden');
        }

        function tratarArquivoAnexo(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    appState.anexoAtualBase64 = e.target.result;
                    appState.anexoAtualNome = file.name;
                    document.getElementById('preview-filename').innerText = file.name;
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('drop-zone-content').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removerAnexoPreview(e) {
            e.stopPropagation();
            appState.anexoAtualBase64 = null;
            appState.anexoAtualNome = null;
            document.getElementById('report-img-input').value = '';
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('drop-zone-content').classList.remove('hidden');
        }

        function abrirVisualizacaoAnexo(base64Encoded, nomeArquivo) {
            const dataUrl = decodeURIComponent(base64Encoded);
            const nome = decodeURIComponent(nomeArquivo);
            const container = document.getElementById('conteudo-anexo-modal');
            const btnBaixar = document.getElementById('btn-baixar-modal');
            
            btnBaixar.href = dataUrl;
            btnBaixar.download = nome;

            if (dataUrl.startsWith('data:video') || nome.match(/\.(mp4|webm|ogg)$/i)) {
                container.innerHTML = `<video controls class="max-h-[70vh] rounded-xl"><source src="${dataUrl}" type="video/mp4">Seu navegador não suporta vídeos.</video>`;
            } else {
                container.innerHTML = `<img src="${dataUrl}" class="max-h-[70vh] rounded-xl border border-slate-200 dark:border-slate-700 object-contain" alt="${nome}">`;
            }

            document.getElementById('modal-visualizar-anexo').classList.remove('hidden');
            document.getElementById('modal-visualizar-anexo').classList.add('flex');
        }

        function fecharModalVisualizarAnexo() {
            document.getElementById('modal-visualizar-anexo').classList.remove('flex');
            document.getElementById('modal-visualizar-anexo').classList.add('hidden');
            document.getElementById('conteudo-anexo-modal').innerHTML = '';
        }

        // Salvar ocorrência enviando para o Firebase Firestore em tempo real
        async function salvarReport(e) {
            e.preventDefault();
            const autor = document.getElementById('report-autor').value;
            const cliente = document.getElementById('report-cliente').value;
            const plataforma = document.getElementById('report-plataforma').value;
            const tipo = document.getElementById('report-tipo').value;
            const ticketRef = document.getElementById('report-ticket-ref').value;
            const modulo = document.getElementById('report-modulo').value;
            const descricao = document.getElementById('report-descricao').value;

            const novoItem = {
                autor,
                cliente,
                plataforma,
                modulo,
                tipo,
                ticketRef: tipo === 'Validado' ? ticketRef : '',
                descricao,
                anexo: appState.anexoAtualBase64,
                anexoNome: appState.anexoAtualNome,
                data: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                abrirTicket: false,
                comentarios: [],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('ocorrencias').add(novoItem);

                // Se veio do checklist, marca a tarefa como vermelha localmente
                if (appState.tarefaSelecionadaParaReport) {
                    appState.checklistProblemas[appState.tarefaSelecionadaParaReport] = true;
                    salvarChecklistLocal();
                    renderizarChecklist();
                }

                fecharModalReport();
                mudarAba('feed');
            } catch (error) {
                alert('Erro ao salvar no Firestore.');
                console.error(error);
            }
        }

        function abrirModalReportarProblema(cardId) {
            document.getElementById('reportar-problema-card-id').value = cardId;
            document.getElementById('modal-reportar-problema').classList.remove('hidden');
            document.getElementById('modal-reportar-problema').classList.add('flex');
        }

        function fecharModalReportarProblema() {
            document.getElementById('modal-reportar-problema').classList.remove('flex');
            document.getElementById('modal-reportar-problema').classList.add('hidden');
            document.getElementById('form-reportar-problema').reset();
        }

        async function salvarReportarProblema(e) {
            e.preventDefault();
            const cardId = document.getElementById('reportar-problema-card-id').value;
            const autor = document.getElementById('reportar-problema-autor').value;
            const cliente = document.getElementById('reportar-problema-cliente').value;
            const texto = document.getElementById('reportar-problema-comentario').value;

            const item = appState.feed.find(f => f.id === cardId);
            if (item) {
                const novosComentarios = [...item.comentarios, { autor, cliente, texto }];
                try {
                    await db.collection('ocorrencias').doc(cardId).update({ comentarios: novosComentarios });
                    fecharModalReportarProblema();
                } catch (error) {
                    alert('Erro ao adicionar comentário.');
                    console.error(error);
                }
            }
        }

        async function toggleAbrirTicket(cardId, statusAtual) {
            try {
                await db.collection('ocorrencias').doc(cardId).update({ abrirTicket: !statusAtual });
            } catch (error) {
                console.error('Erro ao atualizar ticket:', error);
            }
        }

        async function deletarOcorrencia(cardId) {
            if (confirm('Deseja realmente remover esta ocorrência como indevida?')) {
                try {
                    await db.collection('ocorrencias').doc(cardId).delete();
                } catch (error) {
                    console.error('Erro ao deletar ocorrência:', error);
                }
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "ph-bold ph-moon text-lg";
                localStorage.setItem('tvf_theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "ph-bold ph-sun text-lg";
                localStorage.setItem('tvf_theme', 'dark');
            }
        }

        if (localStorage.getItem('tvf_theme') === 'dark' || (!localStorage.getItem('tvf_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = "ph-bold ph-sun text-lg";
        }
    </script>
</body>
</html>
